<div class="shell">
  <header class="app-topbar">
    <div class="brand">
      <button class="top-action" aria-label="Mostrar menú" (click)="onToggleSidebar()">☰</button>
      <span style="margin-left:8px;">🤖 Nexus</span>
    </div>
    <nav class="top-actions">
      <a routerLink="/" class="top-action">💬 Chat</a>
      <a routerLink="/historial" class="top-action">📜 Historial</a>
      <a routerLink="/documentos" class="top-action">📤 Subir documentos</a>
    </nav>
  </header>

  <div class="shell__content">
    <aside class="shell__sidebar" aria-hidden="false" [class.sidebar--collapsed]="collapsed">
      <nexus-sidebar (closeSidebar)="onCloseSidebar()"></nexus-sidebar>
    </aside>

    <main class="shell__main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div class="floating-theme" aria-hidden="false">
    <button type="button" class="theme-btn" (click)="theme.set(false)">🌤️</button>
    <button type="button" class="theme-btn" (click)="theme.set(true)">🌙</button>
  </div>
</div>
